name: Q571 Review Validation

on:
  push:
    branches: [cashforge/q571-review-validation-20261004]

permissions:
  contents: write

concurrency:
  group: q571-review-validation
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api
      NEXT_PUBLIC_STELLAR_NETWORK: TESTNET
      STELLAR_NETWORK: TESTNET
      STELLAR_HORIZON_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ca6a2a0ed044131d390246f26c0c86135d29012a
          path: candidate-input
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b223d5798fe68c150a429e652f10990d3f632a7d
          fetch-depth: 0
          path: subject
          persist-credentials: false
      - name: Assemble and verify the exact reviewed candidate
        shell: bash
        run: |
          bash candidate-input/assemble-q571.sh "$GITHUB_WORKSPACE/subject"
          cd subject
          test "$(git rev-parse HEAD)" = f634e4f37945d40b0ed4024a88b380f5847fe87a
          test "$(git rev-parse HEAD^{tree})" = cc5b8f56e908f6e60e8bb683211a3d950fd959be
          git merge-base --is-ancestor b223d5798fe68c150a429e652f10990d3f632a7d HEAD
          git merge-base --is-ancestor 282c75ad933651a93b89a8412ab649b48714c739 HEAD
          git diff --check 282c75ad933651a93b89a8412ab649b48714c739 HEAD
          git show --no-patch --format=fuller HEAD
          git diff --stat 282c75ad933651a93b89a8412ab649b48714c739 HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            subject/frontend/package-lock.json
            subject/backend/package-lock.json
      - name: Install locked dependencies
        working-directory: subject
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix backend --no-audit --no-fund
      - name: Execute frontend and existing backend/shared contract checks
        working-directory: subject
        run: python ../controller/work/q571-review/validate_candidate.py
      - name: Retain the validated source on a new candidate ref only
        working-directory: subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = f634e4f37945d40b0ed4024a88b380f5847fe87a
          test "$(git rev-parse HEAD^{tree})" = cc5b8f56e908f6e60e8bb683211a3d950fd959be
          git diff --exit-code HEAD
          git bundle create "$RUNNER_TEMP/q571-validation/source.bundle" HEAD
          sha256sum "$RUNNER_TEMP/q571-validation/source.bundle"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push https://github.com/woahwhattheheck/Quittance0.git f634e4f37945d40b0ed4024a88b380f5847fe87a:refs/heads/validation/q571-candidate-f634e4f
          printf 'VALIDATED_CANDIDATE_REF=validation/q571-candidate-f634e4f\n'
      - name: Retain exact logs and exit-code receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q571-validation-f634e4f
          path: ${{ runner.temp }}/q571-validation/
          if-no-files-found: warn
          retention-days: 14
