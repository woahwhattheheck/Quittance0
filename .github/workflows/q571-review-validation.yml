name: Q571 Review Validation
on:
  push:
    branches: [cashforge/q571-review-validation-20261004]
permissions:
  contents: read
concurrency:
  group: q571-review-validation
  cancel-in-progress: false
jobs:
  generated-file-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api
      NEXT_PUBLIC_STELLAR_NETWORK: TESTNET
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f634e4f37945d40b0ed4024a88b380f5847fe87a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Capture changes from install, lint and typecheck only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/q571-drift"
          test "$(git rev-parse HEAD)" = f634e4f37945d40b0ed4024a88b380f5847fe87a
          test "$(git rev-parse HEAD^{tree})" = cc5b8f56e908f6e60e8bb683211a3d950fd959be
          git diff --exit-code HEAD
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'q571-drift'
          rows = []
          for name,args in [('install',['npm','ci','--prefix','frontend','--no-audit','--no-fund']),('lint',['npm','--prefix','frontend','run','lint']),('typecheck',['npm','--prefix','frontend','run','typecheck'])]:
              result = subprocess.run(args, capture_output=True, text=True, timeout=240)
              (out / f'{name}.log').write_text(result.stdout + result.stderr)
              diff = subprocess.check_output(['git','diff','--binary','HEAD'], text=True)
              (out / f'{name}.diff').write_text(diff)
              changed = subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
              rows.append({'step':name,'command':args,'exit_code':result.returncode,'changed_files':changed})
              print(f'Q571_DRIFT_STEP={json.dumps(rows[-1])}',flush=True)
              print(diff,flush=True)
              if result.returncode:
                  print(result.stdout + result.stderr,flush=True)
          changed = subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          generated='frontend/next-env.d.ts'
          before=subprocess.check_output(['git','show',f'HEAD:{generated}'],text=True)
          after=Path(generated).read_text()
          # Preserve triple-slash declarations; only plain comment text may vary.
          substantive=lambda s:[line for line in s.splitlines() if line.strip() and not line.lstrip().startswith('// ')]
          comment_only=changed == [generated] and substantive(before) == substantive(after)
          receipt={'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree_sha':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'node':subprocess.check_output(['node','--version'],text=True).strip(),'steps':rows,'generated_next_env_comment_only':comment_only,'before_sha256':hashlib.sha256(before.encode()).hexdigest(),'after_sha256':hashlib.sha256(after.encode()).hexdigest(),'passing_test_run_reused':37189795925,'tests_rerun':False}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('Q571_DRIFT_RECEIPT='+json.dumps(receipt,sort_keys=True),flush=True)
          raise SystemExit(0 if comment_only and all(r['exit_code']==0 for r in rows) else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q571-generated-file-diagnostic-f634e4f
          path: ${{ runner.temp }}/q571-drift/
          retention-days: 14
          if-no-files-found: error
