name: Q571 Review Validation
on:
  push:
    branches: [cashforge/q571-review-validation-20261004]
permissions:
  contents: read
concurrency:
  group: q571-review-validation
  cancel-in-progress: false
jobs:
  pristine-source-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api
      NEXT_PUBLIC_STELLAR_NETWORK: TESTNET
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f634e4f37945d40b0ed4024a88b380f5847fe87a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify and typecheck the unmodified candidate
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'q571-pristine-source'
          out.mkdir()
          def read(*args):
              return subprocess.check_output(args,text=True).strip()
          def require(condition,message):
              if not condition:
                  raise RuntimeError(message)
          receipt={'source_sha':read('git','rev-parse','HEAD'),'tree_sha':read('git','rev-parse','HEAD^{tree}'),'node':read('node','--version'),'steps':[],'tests_rerun':False,'prior_project_checks_run':37189795925}
          try:
              require(receipt['source_sha']=='f634e4f37945d40b0ed4024a88b380f5847fe87a','Unexpected candidate commit')
              require(receipt['tree_sha']=='cc5b8f56e908f6e60e8bb683211a3d950fd959be','Unexpected candidate tree')
              require(not read('git','diff','--name-only','HEAD'),'Checkout is dirty')
              path='frontend/next-env.d.ts'
              content=Path(path).read_bytes()
              tracked=subprocess.check_output(['git','show',f'HEAD:{path}'])
              receipt['declaration']={'git_blob':read('git','rev-parse',f'HEAD:{path}'),'worktree_git_blob':read('git','hash-object',path),'sha256':hashlib.sha256(content).hexdigest(),'byte_count':len(content),'base64':base64.b64encode(content).decode()}
              require(content==tracked,'Worktree declaration differs from exact Git object')
              require(receipt['declaration']['git_blob']==receipt['declaration']['worktree_git_blob'],'Git object identity mismatch')
              (out/'next-env.original.d.ts').write_bytes(content)
              for name,args in [('locked-install',['npm','ci','--prefix','frontend','--no-audit','--no-fund']),('pristine-typecheck',['npm','--prefix','frontend','run','typecheck'])]:
                  result=subprocess.run(args,capture_output=True,text=True,timeout=240)
                  (out/f'{name}.log').write_text(result.stdout+result.stderr)
                  changed=read('git','diff','--name-only','HEAD').splitlines()
                  receipt['steps'].append({'name':name,'command':args,'exit_code':result.returncode,'changed_files':changed})
                  print('Q571_PRISTINE_STEP='+json.dumps(receipt['steps'][-1]),flush=True)
                  require(result.returncode==0,f'{name} failed')
                  require(not changed,f'{name} changed tracked source')
                  require(Path(path).read_bytes()==tracked,f'{name} changed source declaration')
              receipt['passed']=True
          except Exception as exc:
              receipt['passed']=False
              receipt['error']=str(exc)
          finally:
              diff=subprocess.check_output(['git','diff','--binary','HEAD'],text=True)
              (out/'final.diff').write_text(diff)
              receipt['final_changed_files']=read('git','diff','--name-only','HEAD').splitlines()
              (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
              print('Q571_PRISTINE_RECEIPT='+json.dumps(receipt,sort_keys=True),flush=True)
          raise SystemExit(0 if receipt['passed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q571-pristine-source-f634e4f
          path: ${{ runner.temp }}/q571-pristine-source/
          retention-days: 14
          if-no-files-found: error
