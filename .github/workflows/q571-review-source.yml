name: Invoice contract current-main source
on:
  push:
    branches: [validation/q571-review-source-20261004]
    paths: [.github/workflows/q571-review-source.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b223d5798fe68c150a429e652f10990d3f632a7d
          fetch-depth: 0
          path: subject
          persist-credentials: false
      - name: Capture the submitted branch and actual upstream main
        working-directory: subject
        shell: bash
        run: |
          mkdir -p ../evidence
          test "$(git rev-parse HEAD)" = b223d5798fe68c150a429e652f10990d3f632a7d
          git remote add upstream https://github.com/Quittance-Labs/Quittance0.git
          git fetch --no-tags upstream 282c75ad933651a93b89a8412ab649b48714c739
          { git rev-parse HEAD HEAD^{tree} FETCH_HEAD FETCH_HEAD^{tree}; git merge-base HEAD FETCH_HEAD; } | tee ../evidence/source.txt
          git branch review-head b223d5798fe68c150a429e652f10990d3f632a7d
          git branch review-main 282c75ad933651a93b89a8412ab649b48714c739
          git bundle create ../evidence/source.bundle review-head review-main
          git config user.name woahwhattheheck
          git config user.email 293286387+woahwhattheheck@users.noreply.github.com
          set +e
          git merge --no-commit --no-ff 282c75ad933651a93b89a8412ab649b48714c739 > ../evidence/merge.log 2>&1
          status=$?
          set -e
          test "$status" -le 1
          cat ../evidence/merge.log
          git status --short > ../evidence/merge-status.txt
          git diff --name-only --diff-filter=U > ../evidence/conflicts.txt
          git diff --name-only 282c75ad933651a93b89a8412ab649b48714c739 > ../evidence/changed-vs-main.txt
          sha256sum ../evidence/source.bundle > ../evidence/bundle-sha256.txt
      - name: Retain exact merge inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q571-current-main-b223d579-282c75ad
          path: evidence/
          retention-days: 14
          if-no-files-found: error
