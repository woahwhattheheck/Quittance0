name: Invoice list contract repair
on:
  push:
    branches: [validation/invoice-list-array-20261004]
    paths: [.github/workflows/invoice-list-array-once.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 31650ab73508d70e1020b295298b2c499947447f
          persist-credentials: false
      - name: Reconcile source and existing compatibility test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object shared/invoice-contract.ts)" = f889b4eea91f3d74528ba24b4916cc5ec566d500
          test "$(git hash-object backend/tests/invoice-response-success-contract.test.ts)" = 3787978046ebbd1467bdeec30074a86ad5dc4c81
          cp shared/invoice-contract.ts /tmp/invoice-contract-before.ts
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('shared/invoice-contract.ts')
          source = path.read_bytes().decode('utf-8')
          old = '): ContractResult<ListInvoicesResponse> {\n  if (!isSuccessfulResponse(input))'
          new = '): ContractResult<ListInvoicesResponse> {\n  if (Array.isArray(input)) {\n    return parseListInvoicesResponse({ success: true, data: input });\n  }\n  if (!isSuccessfulResponse(input))'
          dead = '  const list = Array.isArray(input.data)\n    ? input.data\n    : Array.isArray(input)\n      ? input\n      : null;'
          assert source.count(old) == source.count(dead) == 1
          source = source.replace(old, new).replace(dead, '  const list = Array.isArray(input.data) ? input.data : null;')
          path.write_bytes(source.encode('utf-8'))
          test_path = Path('backend/tests/invoice-response-success-contract.test.ts')
          test_source = test_path.read_bytes().decode('utf-8')
          old_test = "    for (const input of [null, false, 'false', 0, []]) {\n      assert.equal(parse(input).success, false, parse.name);\n    }"
          new_test = "    for (const input of [null, false, 'false', 0]) {\n      assert.equal(parse(input).success, false, parse.name);\n    }\n    if (parse === contract.parseListInvoicesResponse) {\n      assert.deepEqual(parse([invoice]), envelope);\n      assert.deepEqual(parse([]), parse({ success: true, data: [] }));\n      assert.equal(parse([{ ...invoice, amount: 0 }]).success, false);\n    } else {\n      assert.equal(parse([]).success, false, parse.name);\n    }"
          assert test_source.count(old_test) == 1
          test_source = test_source.replace(old_test, new_test)
          test_path.write_bytes(test_source.encode('utf-8'))
          for name, content in [('source', source), ('test', test_source)]:
              Path('/tmp/invoice-' + name + '-blob.json').write_text(json.dumps({'content': content, 'encoding': 'utf-8'}))
          PY
          node <<'JS'
          const fs = require('node:fs');
          const {stripTypeScriptTypes} = require('node:module');
          const root = '/tmp/invoice-list-reconciled';
          fs.mkdirSync(root, {recursive:true});
          function emit(input, output, from, to) {
            let text = stripTypeScriptTypes(fs.readFileSync(input, 'utf8'));
            if (from) {
              if (text.split(from).length !== 2) throw new Error('unexpected runtime import: '+input);
              text = text.replace(from, to);
            }
            fs.writeFileSync(root+'/'+output, text);
          }
          emit('shared/invoice-validation.ts', 'invoice-validation.mjs');
          emit('shared/invoice-contract.ts', 'invoice-contract.mjs', "'./invoice-validation'", "'./invoice-validation.mjs'");
          emit('/tmp/invoice-contract-before.ts', 'invoice-contract-before.mjs', "'./invoice-validation'", "'./invoice-validation.mjs'");
          emit('backend/tests/invoice-response-success-contract.test.ts', 'contract.test.mjs', "'../../shared/invoice-contract'", "'./invoice-contract.mjs'");
          JS
          node --test /tmp/invoice-list-reconciled/contract.test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {parseListInvoicesResponse as before} from '/tmp/invoice-list-reconciled/invoice-contract-before.mjs';
          import {parseListInvoicesResponse as after} from '/tmp/invoice-list-reconciled/invoice-contract.mjs';
          const invoice = {id:'legacy-1',sellerPublicKey:'seller-key',amount:1,assetCode:'XLM',memo:'memo',status:'PENDING',createdAt:'2026-10-04T00:00:00.000Z',expiresAt:'2026-10-05T00:00:00.000Z'};
          for (const input of [[], [invoice]]) {
            assert.equal(before(input).success, false);
            assert.equal(after(input).success, true);
            assert.deepEqual(after(input), before({success:true,data:input}));
          }
          for (const input of [
            {success:true,data:[invoice],pagination:{limit:20,offset:40,total:100}},
            {success:true,data:[invoice]},
            {success:true,data:[invoice],pagination:{limit:20,offset:-1,total:100}},
            {success:false,data:[invoice]},
          ]) assert.deepEqual(after(input), before(input));
          assert.equal(after([{...invoice,amount:0}]).success, false);
          console.log('PASS: complete production contract plus real validation dependency, native type stripping and temporary ESM import-path adaptation. Legacy lists0/2 before→2/2 after; five controls retained. Existing two response-contract tests passed. No project typecheck, HTTP, database or full repository suite executed.');
          JS
          git diff --check
          git diff --stat
          git diff -- shared/invoice-contract.ts backend/tests/invoice-response-success-contract.test.ts
      - name: Preserve checked file blobs without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo SOURCE_BLOB
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/invoice-source-blob.json
          echo TEST_BLOB
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/invoice-test-blob.json
