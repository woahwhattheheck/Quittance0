name: Quittance 566 late-settlement regression

on:
  push:
    branches:
      - validation/q566-late-settlement-20261004-13a0

permissions:
  contents: read

concurrency:
  group: q566-late-settlement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-case:
    name: Maintained late-settlement case on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quittance_test
      STELLAR_NETWORK: TESTNET
      STELLAR_HORIZON_URL: http://127.0.0.1:1
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quittance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quittance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f96fffe1ffd26cdf04bd4dfe9faf239cb7bac7fe
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        run: npm ci

      - name: Verify pinned source and native PostgreSQL
        run: |
          test "$(git rev-parse HEAD)" = "f96fffe1ffd26cdf04bd4dfe9faf239cb7bac7fe"
          test "$(git hash-object tests/invoice-postgres.integration.test.ts)" = "d88dca567e8d458bb8930ca92430b641cfb21456"
          node --version
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            console.log((await pool.query('SELECT version()')).rows[0].version);
          } finally {
            await pool.end();
          }
          NODE

      - name: Run the one affected maintained integration case
        run: |
          node --import tsx --test --test-isolation=none --test-reporter=tap --test-name-pattern='records a matched late payment after expiry as PAID' tests/invoice-postgres.integration.test.ts | tee "$RUNNER_TEMP/q566-case.tap"
          grep -Eq '^# pass 1$' "$RUNNER_TEMP/q566-case.tap"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/q566-case.tap"
